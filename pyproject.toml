[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[project]
name = "mjlab-upkie"
version = "1.1.0"
license = "Apache-2.0"
description = "Reinforcement learning environments for the Upkie robot based on MjLab."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "mjlab==1.3.0",
    "warp-lang==1.12.0",
    "onnxruntime",
    "scipy>=1.17.1",
]

[project.entry-points."mjlab.tasks"]
mjlab_upkie = "mjlab_upkie.tasks"

[tool.ruff]
src = ["src"]  # Helpful for recognizing first-party imports.
indent-width = 4
exclude = [
  "src/mjlab/third_party",
  "typings",
]
